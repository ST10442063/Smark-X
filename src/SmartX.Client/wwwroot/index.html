<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart-X Gateway</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/site.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <!-- Shown while the .NET runtime downloads, replaced by the app on first render. -->
        <div class="boot">
            <span class="brand-mark" aria-hidden="true">&#9679;</span>
            <span>Starting the Smart-X console&hellip;</span>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        The console hit an unexpected error.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" aria-label="Dismiss">&#10005;</span>
    </div>

    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>

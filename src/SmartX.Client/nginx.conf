# Serves the published Blazor WebAssembly console.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The .wasm runtime must be served as application/wasm or the browser refuses
    # to compile it with streaming instantiation. The mime table nginx loads at the
    # http level already maps it, so nothing is redeclared here.

    gzip on;
    gzip_types application/wasm application/octet-stream application/json text/css application/javascript;

    # Client-side routes such as /sensors/{id} exist only inside the app. Any path
    # that is not a real file falls back to index.html so a refresh or a pasted
    # deep link loads the app, which then renders the right page itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted framework files never change under the same name.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # appsettings.json is read at boot; never cache it, so a changed gateway URL
    # takes effect on the next page load.
    location = /appsettings.json {
        add_header Cache-Control "no-store";
    }
}
